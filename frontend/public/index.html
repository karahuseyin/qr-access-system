<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f172a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="QR Geçiş">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/icon-180.png">
    <title>QR Geçiş Sistemi</title>
    <style>
:root{--bg:#0f172a;--card:#1e293b;--surface:#334155;--accent:#22d3ee;--accent2:#0891b2;--hi:#f1f5f9;--mid:#94a3b8;--lo:#475569;--danger:#f87171;--ok:#4ade80;--border:rgba(148,163,184,.15)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--hi);font-family:system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .3s;overflow-y:auto;padding:20px}
.screen.active{opacity:1;pointer-events:all}
/* Giriş */
.card{width:min(420px,100%);background:var(--card);border:1px solid var(--border);border-radius:24px;padding:36px 32px;display:flex;flex-direction:column;gap:14px}
.logo{width:52px;height:52px;background:linear-gradient(135deg,var(--accent2),var(--accent));border-radius:14px;display:grid;place-items:center;font-size:24px}
.card h1{font-size:1.5rem;font-weight:700}
.subtitle{font-size:.88rem;color:var(--mid);margin-top:-6px}
.fg{display:flex;flex-direction:column;gap:6px}
label{font-size:.78rem;font-weight:600;color:var(--mid);letter-spacing:.04em}
input{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:11px 14px;color:var(--hi);font-size:.95rem;font-family:inherit;outline:none;transition:border-color .2s;width:100%}
input:focus{border-color:var(--accent)}
input::placeholder{color:var(--lo)}
.btn{background:var(--accent);color:var(--bg);border:none;border-radius:8px;padding:13px 24px;font-size:.95rem;font-weight:700;font-family:inherit;cursor:pointer;transition:background .2s,transform .1s;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:4px}
.btn:hover{background:var(--accent2);color:var(--hi)}
.btn:active{transform:scale(.98)}
.btn:disabled{background:var(--surface);color:var(--lo);cursor:not-allowed}
.spin{width:16px;height:16px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:spin .6s linear infinite;display:none}
.loading .spin{display:block}
@keyframes spin{to{transform:rotate(360deg)}}
.err{font-size:.85rem;color:var(--danger);background:rgba(248,113,113,.08);border:1px solid rgba(248,113,113,.25);border-radius:6px;padding:9px 12px;line-height:1.5}
.hint{font-size:.78rem;color:var(--lo);text-align:center}
.hidden{display:none!important}
/* QR Ekranı */
#screen-qr{background:var(--bg);padding:0;overflow:hidden}
.hdr{position:fixed;top:0;left:0;right:0;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:rgba(15,23,42,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);z-index:10}
.uname{font-size:.95rem;font-weight:600}
.logout-btn{background:transparent;border:1px solid var(--border);color:var(--mid);cursor:pointer;padding:6px 12px;border-radius:6px;font-size:.8rem;font-family:inherit;transition:background .2s,color .2s}
.logout-btn:hover{background:var(--surface);color:var(--hi)}
.qr-main{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;width:100%;height:100vh;padding:76px 24px 40px}
.qr-wrap{position:relative;padding:16px;background:#fff;border-radius:16px;box-shadow:0 0 60px rgba(34,211,238,.2)}
.corner{position:absolute;width:22px;height:22px;border-color:var(--accent);border-style:solid}
.tl{top:-3px;left:-3px;border-width:3px 0 0 3px;border-radius:4px 0 0 0}
.tr{top:-3px;right:-3px;border-width:3px 3px 0 0;border-radius:0 4px 0 0}
.bl{bottom:-3px;left:-3px;border-width:0 0 3px 3px;border-radius:0 0 0 4px}
.br{bottom:-3px;right:-3px;border-width:0 3px 3px 0;border-radius:0 0 4px 0}
#qr-target{width:220px;height:220px;display:flex;align-items:center;justify-content:center}
#qr-target canvas,#qr-target table{display:block}
.ph{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;width:220px;height:220px;color:var(--lo);font-size:.8rem}
.ph-spin{width:28px;height:28px;border:3px solid var(--surface);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite}
.timer-sec{width:min(300px,100%);display:flex;flex-direction:column;gap:10px;align-items:center}
.tlabel{font-size:.88rem;color:var(--mid);text-align:center}
.tlabel strong{color:var(--accent);font-variant-numeric:tabular-nums}
.track{width:100%;height:5px;background:var(--surface);border-radius:3px;overflow:hidden}
.fill{height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));border-radius:3px;transition:width 1s linear;will-change:width}
.strip{display:flex;align-items:center;gap:20px;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px 24px;width:min(300px,100%)}
.si{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1}
.sl{font-size:.7rem;font-weight:700;color:var(--lo);letter-spacing:.1em;text-transform:uppercase}
.sv{font-size:1rem;font-weight:600;font-family:'Courier New',monospace;letter-spacing:.12em}
.sdiv{width:1px;height:36px;background:var(--border)}
.badge{font-size:.78rem;font-weight:700;padding:3px 10px;border-radius:20px}
.bok{background:rgba(74,222,128,.15);color:var(--ok)}
.berr{background:rgba(248,113,113,.15);color:var(--danger)}
.obar{position:fixed;bottom:0;left:0;right:0;background:rgba(251,191,36,.1);border-top:1px solid rgba(251,191,36,.3);color:#fbbf24;font-size:.78rem;text-align:center;padding:8px}
.pwa-btn{position:fixed;bottom:44px;right:16px;z-index:99;background:var(--accent);color:var(--bg);border:none;border-radius:24px;padding:10px 18px;font-size:.82rem;font-weight:700;font-family:inherit;cursor:pointer;box-shadow:0 4px 20px rgba(34,211,238,.35)}
.pwa-btn:active{transform:scale(.97)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--card);border:1px solid var(--border);color:var(--hi);padding:12px 20px;border-radius:40px;font-size:.88rem;font-weight:500;box-shadow:0 8px 32px rgba(0,0,0,.4);transition:transform .3s cubic-bezier(.34,1.56,.64,1);z-index:100;white-space:nowrap}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.ok{border-color:rgba(74,222,128,.4);color:var(--ok)}
.toast.er{border-color:rgba(248,113,113,.4);color:var(--danger)}
@media(max-width:380px){#qr-target{width:180px;height:180px}.card{padding:24px 18px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
    </style>
</head>
<body>

<!-- EKRAN 1: Giriş -->
<div id="screen-login" class="screen active">
  <div class="card">
    <div class="logo">🔐</div>
    <h1>QR Geçiş</h1>
    <p class="subtitle">Cihazınızı bir kez kaydedin</p>
    <div class="fg"><label for="inp-name">Ad Soyad</label><input type="text" id="inp-name" placeholder="Adınızı girin" autocomplete="name"></div>
    <div class="fg"><label for="inp-email">E-posta</label><input type="email" id="inp-email" placeholder="ornek@firma.com" autocomplete="email"></div>
    <div class="fg"><label for="inp-srv">Sunucu Adresi</label><input type="url" id="inp-srv" placeholder="Boş bırakılırsa bu sunucu kullanılır" value=""></div>
    <button id="btn-reg" class="btn"><span class="spin"></span><span class="bt">Cihazı Kaydet</span></button>
    <p id="err" class="err hidden"></p>
    <p class="hint">İlk kayıt için internet bağlantısı gereklidir.</p>
  </div>
</div>

<!-- EKRAN 2: QR -->
<div id="screen-qr" class="screen">
  <header class="hdr">
    <span id="hdr-name">—</span>
    <button id="btn-logout" class="logout-btn">Çıkış</button>
  </header>
  <main class="qr-main">
    <div class="qr-wrap">
      <div id="qr-target"><div class="ph"><div class="ph-spin"></div><span>Üretiliyor…</span></div></div>
      <div class="corner tl"></div><div class="corner tr"></div>
      <div class="corner bl"></div><div class="corner br"></div>
    </div>
    <div class="timer-sec">
      <p class="tlabel">Yeni kod üretiliyor… <strong id="cd">30</strong> sn</p>
      <div class="track"><div id="fill" class="fill" style="width:100%"></div></div>
    </div>
    <div class="strip">
      <div class="si"><span class="sl">Kod</span><span id="cur-code" class="sv">––––––</span></div>
      <div class="sdiv"></div>
      <div class="si"><span class="sl">Durum</span><span id="badge" class="badge bok">Hazır</span></div>
    </div>
  </main>
  <div id="obar" class="obar hidden">● Çevrimdışı — QR kodlar internet olmadan çalışır</div>
</div>

<div id="toast" class="toast"></div>
<button id="pwa-install" class="pwa-btn hidden">⬇ Uygulamayı Yükle</button>

<script src="lib/otpauth.umd.min.js"></script>

  load(){try{return{userId:localStorage.getItem(this.K.UID),userName:localStorage.getItem(this.K.UN),secretSeed:localStorage.getItem(this.K.SEED),serverUrl:localStorage.getItem(this.K.SRV)}}catch(e){return{}}},
  clear(){Object.values(this.K).forEach(k=>localStorage.removeItem(k))},
  ok(){const{userId,secretSeed}=this.load();return!!(userId&&secretSeed)}
};

/* ── TOTP (RFC 6238) ──
   Öncelik: otpauth kütüphanesi — saf JS olduğu için HTTP (güvensiz bağlam) dahil her yerde çalışır.
   Yedek:   Web Crypto API — yalnızca HTTPS/localhost'ta mevcuttur. */
const TOTP={
  viaLib(secret){try{if(!window.OTPAuth)return null;return new OTPAuth.TOTP({secret:secret,digits:6,period:30}).generate()}catch(e){return null}},
  b32(s){const A='ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';const c=s.toUpperCase().replace(/=+$/,'').replace(/\s/g,'');let bits=0,val=0;const o=[];for(let i=0;i<c.length;i++){const x=A.indexOf(c[i]);if(x<0)continue;val=(val<<5)|x;bits+=5;if(bits>=8){bits-=8;o.push((val>>>bits)&0xFF)}}return new Uint8Array(o)},
  async hmac(k,m){const key=await crypto.subtle.importKey('raw',k,{name:'HMAC',hash:'SHA-1'},false,['sign']);return new Uint8Array(await crypto.subtle.sign('HMAC',key,m))},
  async gen(secret,step=30){
    if(step===30){const libCode=this.viaLib(secret);if(libCode)return libCode}
    const kb=this.b32(secret);const T=Math.floor(Date.now()/1000/step);const ctr=new Uint8Array(8);let t=T;for(let i=7;i>=0;i--){ctr[i]=t&0xFF;t=Math.floor(t/256)}const h=await this.hmac(kb,ctr);const off=h[19]&0x0F;const code=(((h[off]&0x7F)<<24)|((h[off+1]&0xFF)<<16)|((h[off+2]&0xFF)<<8)|(h[off+3]&0xFF))%1000000;return String(code).padStart(6,'0')}
};

/* ── QR RENDER (qrcode.js kütüphanesi) ── */
let _qrObj=null;

function renderQR(text){
  const target=document.getElementById('qr-target');
  if(_qrObj){
    // mevcut QR nesnesini güncelle
    _qrObj.clear();
    _qrObj.makeCode(text);
  } else {
    target.innerHTML='';
    _qrObj=new QRCode(target,{
      text:text,
      width:220,height:220,
      colorDark:'#000000',colorLight:'#ffffff',
      correctLevel:QRCode.CorrectLevel.M
    });
  }
  document.getElementById('cur-code').textContent=text.split(':')[1]||'';
  const b=document.getElementById('badge');b.textContent='Hazır';b.className='badge bok';
}

/* ── TIMER ── */
const STEP=30000;
let _tick=null,_uid=null,_seed=null;

async function update(){
  if(!_seed||!_uid)return;
  try{
    const code=await TOTP.gen(_seed,30);
    renderQR(_uid+':'+code);
  }catch(e){
    console.error(e);
    const b=document.getElementById('badge');b.textContent='Hata';b.className='badge berr';
  }
}

function startTimer(){
  clearInterval(_tick);
  update();
  _tick=setInterval(()=>{
    const e=Date.now()%STEP;
    const r=Math.ceil((STEP-e)/1000);
    const p=((STEP-e)/STEP)*100;
    document.getElementById('cd').textContent=r;
    document.getElementById('fill').style.width=p+'%';
    if(r===30)update();
  },1000);
}

/* ── SCREEN ── */
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active')}

let _tt=null;
function toast(m,t=''){const el=document.getElementById('toast');el.textContent=m;el.className='toast show'+(t?' '+t:'');clearTimeout(_tt);_tt=setTimeout(()=>el.classList.remove('show'),3000)}

function offline(){document.getElementById('obar').classList.toggle('hidden',navigator.onLine)}

/* ── KAYIT ── */
async function reg(){
  const name=document.getElementById('inp-name').value.trim();
  const email=document.getElementById('inp-email').value.trim();
  const srv=(document.getElementById('inp-srv').value.trim()||location.origin).replace(/\/+$/,'');
  const errEl=document.getElementById('err');
  const btn=document.getElementById('btn-reg');
  errEl.classList.add('hidden');
  if(!name||!email||!srv){errEl.textContent='Tüm alanları doldurun.';errEl.classList.remove('hidden');return}
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){errEl.textContent='Geçerli e-posta girin.';errEl.classList.remove('hidden');return}
  btn.disabled=true;btn.classList.add('loading');
  try{
    const res=await fetch(srv+'/api/auth/register-device',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,email})});
    const data=await res.json();
    if(!res.ok||data.status!=='success')throw new Error(data.message||'HTTP '+res.status);
    S.save({userId:data.data.userId,userName:data.data.name||name,secretSeed:data.data.secretSeed,serverUrl:srv});
    toast('Kayıt başarılı!','ok');
    startQR({userId:data.data.userId,userName:data.data.name||name,secretSeed:data.data.secretSeed});
  }catch(e){
    errEl.textContent='Hata: '+e.message;errEl.classList.remove('hidden');
  }finally{btn.disabled=false;btn.classList.remove('loading')}
}

function startQR({userId,userName,secretSeed}){
  _uid=String(userId);_seed=secretSeed;_qrObj=null;
  document.getElementById('qr-target').innerHTML='<div class="ph"><div class="ph-spin"></div><span>Üretiliyor…</span></div>';
  document.getElementById('hdr-name').textContent=userName||'Kullanıcı';
  show('screen-qr');offline();startTimer();
}

function logout(){
  if(!confirm('Cihaz kaydı silinecek. Devam?'))return;
  clearInterval(_tick);_qrObj=null;_uid=null;_seed=null;S.clear();
  document.getElementById('qr-target').innerHTML='<div class="ph"><div class="ph-spin"></div><span>Üretiliyor…</span></div>';
  show('screen-login');
}

/* ── INIT ── */
document.getElementById('btn-reg').addEventListener('click',reg);
document.getElementById('btn-logout').addEventListener('click',logout);
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&document.getElementById('screen-login').classList.contains('active'))reg()});
window.addEventListener('online',offline);window.addEventListener('offline',offline);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&_seed)update()});

/* ── PWA: Service Worker + kurulum istemi ── */
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('service-worker.js')
      .catch(err=>console.warn('[SW] Kayıt başarısız (PWA/offline için HTTPS veya localhost gerekir):',err));
  });
}
let _installEvt=null;
const _ib=document.getElementById('pwa-install');
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();_installEvt=e;_ib.classList.remove('hidden')});
_ib.addEventListener('click',async()=>{if(!_installEvt)return;_installEvt.prompt();try{await _installEvt.userChoice}catch(e){}_installEvt=null;_ib.classList.add('hidden')});
window.addEventListener('appinstalled',()=>_ib.classList.add('hidden'));

if(S.ok()){const d=S.load();startQR({userId:d.userId,userName:d.userName,secretSeed:d.secretSeed})}
else show('screen-login');
</script>
